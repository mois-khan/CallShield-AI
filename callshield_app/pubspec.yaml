name: callshield_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3

  shared_preferences: ^2.5.4
  google_fonts: ^6.1.0

  share_plus: ^12.0.1
  url_launcher: ^6.3.0

  vibration: ^3.1.7
  audioplayers: ^5.2.1
  dash_bubble: ^2.0.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^20.1.0
  permission_handler: ^12.0.1
  http: ^1.4.0
  sms_sender_background: ^1.0.7
  pdf: ^3.12.0
  path_provider: ^2.1.5
  flutter_email_sender: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # MESSAGE SHIELD assets (on-device model + local scam intelligence).
  # The evaluation corpus is intentionally NOT bundled: it lives in the repo for
  # tests and for tool/message_shield_eval.dart only.
  assets:
    - assets/message_shield/ml/
    - assets/message_shield/intelligence/